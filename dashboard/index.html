<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Library Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #141414;
      --bg-card: #1a1a1a;
      --text-primary: #ecfdf5;
      --text-secondary: #a1a1aa;
      --accent: #10b981;
      --accent-light: rgba(16, 185, 129, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--accent), #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-secondary);
      font-size: 1.1rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .stat-card {
      background: var(--bg-card);
      border-radius: 1rem;
      padding: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-card h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    .stat-card .value {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--accent);
    }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .chart-container {
      background: var(--bg-card);
      border-radius: 1rem;
      padding: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .chart-container h3 {
      font-size: 1rem;
      margin-bottom: 1rem;
      color: var(--text-primary);
    }

    .chart-container canvas {
      max-height: 300px;
    }

    .keywords-section {
      background: var(--bg-card);
      border-radius: 1rem;
      padding: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 3rem;
    }

    .keywords-section h3 {
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .keyword-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .keyword {
      background: var(--accent-light);
      color: var(--accent);
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .keyword .count {
      opacity: 0.7;
      margin-left: 0.25rem;
    }

    .insights-section {
      background: var(--bg-card);
      border-radius: 1rem;
      padding: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .insights-section h3 {
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .insight {
      padding: 1rem;
      border-left: 3px solid var(--accent);
      background: var(--accent-light);
      margin-bottom: 0.75rem;
      border-radius: 0 0.5rem 0.5rem 0;
    }

    .insight .text {
      margin-bottom: 0.25rem;
    }

    .insight .meta {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .loading {
      text-align: center;
      padding: 4rem;
      color: var(--text-secondary);
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-secondary);
      font-size: 0.875rem;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Prompt Library Dashboard</h1>
    <p>AI 협업 프롬프트 통계 및 분석</p>
  </header>

  <main id="main-content">
    <div class="loading">데이터를 불러오는 중...</div>
  </main>

  <footer>
    <p>
      <a href="https://github.com/HMWKR/prompt-library">GitHub</a> |
      마지막 업데이트: <span id="last-update">-</span>
    </p>
  </footer>

  <script>
    const COLORS = {
      accent: '#10b981',
      types: ['#10b981', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316']
    };

    async function loadDashboard() {
      try {
        const [stats, index] = await Promise.all([
          fetch('./global/stats/summary.json').then(r => r.json()),
          fetch('./global/index.json').then(r => r.json())
        ]);

        renderDashboard(stats, index);
      } catch (error) {
        document.getElementById('main-content').innerHTML = `
          <div class="loading">
            <p>데이터를 불러올 수 없습니다.</p>
            <p style="font-size: 0.875rem; margin-top: 0.5rem;">
              아직 프롬프트가 수집되지 않았거나 파일 경로를 확인해주세요.
            </p>
          </div>
        `;
        console.error('Failed to load data:', error);
      }
    }

    function renderDashboard(stats, index) {
      const html = `
        <section class="stats-grid">
          <div class="stat-card">
            <h3>총 프롬프트</h3>
            <div class="value">${stats.total}</div>
          </div>
          <div class="stat-card">
            <h3>프로젝트 수</h3>
            <div class="value">${Object.keys(stats.byProject).length}</div>
          </div>
          <div class="stat-card">
            <h3>평균 단어 수</h3>
            <div class="value">${stats.avgPromptWordCount}</div>
          </div>
          <div class="stat-card">
            <h3>이번 달</h3>
            <div class="value">${Object.values(stats.monthlyTrends).slice(-1)[0] || 0}</div>
          </div>
        </section>

        <section class="charts-grid">
          <div class="chart-container">
            <h3>커밋 타입별 분포</h3>
            <canvas id="type-chart"></canvas>
          </div>
          <div class="chart-container">
            <h3>복잡도 분포</h3>
            <canvas id="complexity-chart"></canvas>
          </div>
          <div class="chart-container">
            <h3>프롬프트 기법 사용</h3>
            <canvas id="technique-chart"></canvas>
          </div>
          <div class="chart-container">
            <h3>월별 트렌드</h3>
            <canvas id="trend-chart"></canvas>
          </div>
        </section>

        <section class="keywords-section">
          <h3>키워드 빈도</h3>
          <div class="keyword-cloud" id="keyword-cloud"></div>
        </section>

        <section class="insights-section">
          <h3>핵심 통찰</h3>
          <div id="insights-list"></div>
        </section>
      `;

      document.getElementById('main-content').innerHTML = html;
      document.getElementById('last-update').textContent = new Date(stats.generatedAt).toLocaleDateString('ko-KR');

      // 차트 렌더링
      renderTypeChart(stats.byType);
      renderComplexityChart(stats.byComplexity);
      renderTechniqueChart(stats.techniqueUsage);
      renderTrendChart(stats.monthlyTrends);
      renderKeywords(stats.keywordFrequency);
      renderInsights(stats.topInsights);
    }

    function renderTypeChart(data) {
      new Chart(document.getElementById('type-chart'), {
        type: 'doughnut',
        data: {
          labels: Object.keys(data),
          datasets: [{
            data: Object.values(data),
            backgroundColor: COLORS.types,
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: '#a1a1aa' }
            }
          }
        }
      });
    }

    function renderComplexityChart(data) {
      new Chart(document.getElementById('complexity-chart'), {
        type: 'bar',
        data: {
          labels: Object.keys(data),
          datasets: [{
            data: Object.values(data),
            backgroundColor: COLORS.accent,
            borderRadius: 8
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#a1a1aa' } },
            x: { grid: { display: false }, ticks: { color: '#a1a1aa' } }
          }
        }
      });
    }

    function renderTechniqueChart(data) {
      const labels = Object.keys(data).map(t => t.replace(/-/g, ' '));
      new Chart(document.getElementById('technique-chart'), {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            data: Object.values(data),
            backgroundColor: COLORS.types,
            borderRadius: 8
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#a1a1aa' } },
            y: { grid: { display: false }, ticks: { color: '#a1a1aa' } }
          }
        }
      });
    }

    function renderTrendChart(data) {
      const months = Object.keys(data).sort();
      new Chart(document.getElementById('trend-chart'), {
        type: 'line',
        data: {
          labels: months,
          datasets: [{
            label: '프롬프트 수',
            data: months.map(m => data[m]),
            borderColor: COLORS.accent,
            backgroundColor: 'rgba(16, 185, 129, 0.1)',
            fill: true,
            tension: 0.4
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#a1a1aa' } },
            x: { grid: { display: false }, ticks: { color: '#a1a1aa' } }
          }
        }
      });
    }

    function renderKeywords(data) {
      const container = document.getElementById('keyword-cloud');
      const entries = Object.entries(data).slice(0, 20);

      container.innerHTML = entries.map(([keyword, count]) =>
        `<span class="keyword">${keyword}<span class="count">(${count})</span></span>`
      ).join('');
    }

    function renderInsights(insights) {
      const container = document.getElementById('insights-list');

      if (!insights || insights.length === 0) {
        container.innerHTML = '<p style="color: var(--text-secondary);">아직 통찰이 없습니다.</p>';
        return;
      }

      container.innerHTML = insights.map(insight =>
        `<div class="insight">
          <div class="text">${insight.text}</div>
          <div class="meta">${insight.project} / ${insight.commit}</div>
        </div>`
      ).join('');
    }

    loadDashboard();
  </script>
</body>
</html>
