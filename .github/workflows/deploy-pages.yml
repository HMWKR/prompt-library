name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'global/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Create public directory
        run: |
          mkdir -p public/data
          mkdir -p public/global
          cp -r data/* public/data/ 2>/dev/null || true
          cp -r global/* public/global/ 2>/dev/null || true
          echo "Deployed at $(date)" > public/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
