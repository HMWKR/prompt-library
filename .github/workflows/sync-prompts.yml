name: Sync Prompts

on:
  schedule:
    - cron: '0 */6 * * *'  # 6시간마다
  workflow_dispatch:
    inputs:
      project:
        description: 'Sync specific project (or "all")'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout prompt-library
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # CalcLab 동기화
      - name: Checkout CalcLab
        uses: actions/checkout@v4
        with:
          repository: HMWKR/CalcLab
          path: source-calclab
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Extract prompts from CalcLab
        working-directory: source-calclab
        run: |
          LAST_SYNC_FILE="../projects/calclab/last_sync.txt"
          if [ -f "$LAST_SYNC_FILE" ]; then
            LAST_SYNC=$(cat "$LAST_SYNC_FILE")
            echo "Last sync: $LAST_SYNC"
          else
            echo "First sync - processing all commits"
          fi
          node ../scripts/extract-prompts.js calclab
          git log -1 --format=%H > "$LAST_SYNC_FILE"

      # promptProject 동기화
      - name: Checkout promptProject
        uses: actions/checkout@v4
        with:
          repository: HMWKR/promptProject
          path: source-promptproject
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Extract prompts from promptProject
        working-directory: source-promptproject
        run: |
          LAST_SYNC_FILE="../projects/promptproject/last_sync.txt"
          if [ -f "$LAST_SYNC_FILE" ]; then
            LAST_SYNC=$(cat "$LAST_SYNC_FILE")
            echo "Last sync: $LAST_SYNC"
          else
            echo "First sync - processing all commits"
          fi
          node ../scripts/extract-prompts.js promptproject
          git log -1 --format=%H > "$LAST_SYNC_FILE"

      # 통계 생성 (한 번만)
      - name: Generate stats
        run: node scripts/generate-stats.js

      # 커밋 및 푸시
      - name: Commit and push
        run: |
          rm -rf source-*

          git config user.name "Prompt Sync Bot"
          git config user.email "bot@noreply.github.com"
          git add projects/ global/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "sync: Update prompts from all projects [skip ci]"
            git push
          fi
