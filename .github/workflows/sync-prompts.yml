name: Sync Prompts (Backup)

# ============================================================
# 이 워크플로우는 백업/폴백용입니다.
#
# 새 아키텍처 (v2.0 - 분산 Push):
#   각 프로젝트가 자체 gh-pages에 prompts.json을 배포하고
#   prompt-dashboard에서 직접 fetch하여 집계합니다.
#
# 이 워크플로우는 긴급 상황이나 수동 동기화가 필요할 때만 사용하세요.
# ============================================================

on:
  # 스케줄 비활성화 - 분산 방식으로 전환
  # schedule:
  #   - cron: '0 */6 * * *'  # 6시간마다
  workflow_dispatch:
    inputs:
      project:
        description: 'Sync specific project (or "all") - 백업용 수동 동기화'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout prompt-library
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Sync all registered projects
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          # projects.json에서 프로젝트 목록 읽기
          if [ ! -f "data/projects.json" ]; then
            echo "No projects.json found"
            exit 0
          fi

          projects=$(cat data/projects.json | jq -c '.projects[]')

          for project in $projects; do
            name=$(echo $project | jq -r '.name')
            repo=$(echo $project | jq -r '.repo')
            name_lower=$(echo "$name" | tr '[:upper:]' '[:lower:]')

            echo "=========================================="
            echo "Processing: $name ($repo)"
            echo "=========================================="

            # 프로젝트 폴더 생성
            mkdir -p "projects/$name_lower"

            # 소스 저장소 체크아웃
            if gh api "repos/$repo" &>/dev/null; then
              git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/$repo.git" "source-$name_lower" || {
                echo "Failed to clone $repo, skipping..."
                continue
              }

              # 프롬프트 추출
              LAST_SYNC_FILE="projects/$name_lower/last_sync.txt"
              if [ -f "$LAST_SYNC_FILE" ]; then
                LAST_SYNC=$(cat "$LAST_SYNC_FILE")
                echo "Last sync: $LAST_SYNC"
              else
                echo "First sync - processing all commits"
              fi

              cd "source-$name_lower"
              node ../scripts/extract-prompts.js "$name_lower" || echo "Extract failed for $name_lower"
              git log -1 --format=%H > "../$LAST_SYNC_FILE" 2>/dev/null || true
              cd ..

              # 정리
              rm -rf "source-$name_lower"
            else
              echo "Repository $repo not accessible, skipping..."
            fi
          done

      # 통계 생성
      - name: Generate stats
        run: node scripts/generate-stats.js

      # 커밋 및 푸시
      - name: Commit and push
        run: |
          rm -rf source-*

          git config user.name "Prompt Sync Bot"
          git config user.email "bot@noreply.github.com"
          git add projects/ global/ data/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "sync: Update prompts from all projects [skip ci]"
            git push
          fi
